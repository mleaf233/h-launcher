name: build

# 手动触发只出工件；打 tag（v*）会自动创建 Release
on:
  workflow_dispatch:
    inputs:
      release:
        description: '同时创建 GitHub Release'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.abi }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
          - abi: x86_64
            rust_target: x86_64-linux-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 25.2.9519653
        shell: pwsh
        run: |
          sdkmanager "ndk;25.2.9519653"
          "ANDROID_NDK_HOME=$env:ANDROID_SDK_ROOT\ndk\25.2.9519653" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build libluajit.a
        shell: pwsh
        run: ./love/src/jni/LuaJIT-2.1/build_android.ps1 -Abi ${{ matrix.abi }}

      - name: Build release APK
        shell: pwsh
        run: ./gradlew.bat :app:assembleNormalRecordRelease "-PtargetAbi=${{ matrix.abi }}" --console=plain

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: H-${{ matrix.abi }}
          path: out/app/outputs/apk/normalRecord/release/H.apk
          retention-days: 1

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: H-*
          path: dist

      - name: Flatten to H-<abi>.apk
        run: |
          cd dist
          for d in H-*; do
            abi="${d#H-}"
            mv "$d/H.apk" "H-$abi.apk"
            rmdir "$d"
          done
          ls -l

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
