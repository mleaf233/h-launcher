name: build

# 手动触发只出工件；打 tag（v*）会自动创建 Release
on:
  workflow_dispatch:
    inputs:
      release:
        description: '同时创建 GitHub Release'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
          - abi: x86_64
            rust_target: x86_64-linux-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它内部会执行 `sdkmanager tools`，
      # 而新版 SDK 仓库已经没有 `tools` 包，action 自己会失败。
      # ubuntu-latest 自带 Android SDK，直接用它的 sdkmanager 装 NDK。
      - name: Install NDK 25.2.9519653
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK" ] || { echo "找不到 Android SDK: $SDK" >&2; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK"     >> "$GITHUB_ENV"

          SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          [ -x "$SDKMGR" ] || { echo "找不到 sdkmanager" >&2; exit 1; }
          echo "sdkmanager: $SDKMGR"

          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$SDK/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build libluajit.a
        run: bash ./love/src/jni/LuaJIT-2.1/build_android.sh ${{ matrix.abi }}

      - name: Build release APK
        run: ./gradlew :app:assembleNormalRecordRelease "-PtargetAbi=${{ matrix.abi }}" --console=plain

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: H-${{ matrix.abi }}
          path: out/app/outputs/apk/normalRecord/release/H.apk
          retention-days: 1

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: H-*
          path: dist

      - name: Flatten to H-<abi>.apk
        run: |
          cd dist
          for d in H-*; do
            abi="${d#H-}"
            mv "$d/H.apk" "H-$abi.apk"
            rmdir "$d"
          done
          ls -l

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
